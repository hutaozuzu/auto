# =====================================================
# Nav2 + SLAM Toolbox configuration
# Robot differenziale indoor - corridoi min 50 cm
# =====================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    plugin: "nav2_bt_navigator::BehaviorTreeNavigator"
    bt_xml_filename: "/home/robot/nav2_behavior_trees/navigate_w_replanning_and_recovery.xml"
    autostart: true
    allow_initial_pose_reuse: true
    replanning_interval: 0.2
    transform_tolerance: 0.1    # tolleranza di 0.2 secondi    


  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    transform_tolerance: 0.1    # tolleranza di 0.2 secondi
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      smooth_path: true
      cost_travel_multiplier: 2.5
      cost_penalty_multiplier: 3.0
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    transform_tolerance: 0.1    # tolleranza di 0.2 secondi    
    min_x_velocity_threshold: 0.08
    min_theta_velocity_threshold: 0.02
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.216 #0.18
      lookahead_dist: 0.30
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.45
      lookahead_time: 1.8
      use_velocity_scaled_lookahead_dist: true
      max_angular_vel: 2.136 #2.5
      max_linear_accel: 0.20
      max_angular_accel: 1.2
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.3       # più permissivo
      goal_dist_tol: 0.05            # entro 8 cm considera goal raggiunto
      goal_yaw_tol: 0.15             # entro ~9° considera goal raggiunto

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 15.0
    max_velocity: [0.216, 0.0, 2.136]
    min_velocity: [-0.216, 0.0, -2.136]
    max_accel: [0.18, 0.0, 1.2]
    max_decel: [-0.28, 0.0, -1.8]

# ----------------- COSTMAPS -----------------

global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    update_frequency: 6.0
    publish_frequency: 3.0
    transform_tolerance: 0.3
    resolution: 0.07
    robot_radius: 0.17
    plugins: ["obstacle_layer","inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: laser_scan_sensor
      laser_scan_sensor:
        sensor_frame: laser_frame
        data_type: LaserScan
        topic: scan
        marking: true
        clearing: true
        obstacle_max_range: 3.0
        obstacle_min_range: 0.1
        raytrace_max_range: 3.5
        raytrace_min_range: 0.1

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.30
      cost_scaling_factor: 1.1

local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    update_frequency: 12.0
    publish_frequency: 6.0
    transform_tolerance: 0.3
    rolling_window: true
    width: 3.0
    height: 3.0
    resolution: 0.07
    robot_radius: 0.17
    plugins: ["obstacle_layer","inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: laser_scan_sensor
      laser_scan_sensor:
        sensor_frame: laser_frame
        data_type: LaserScan
        topic: scan
        marking: true
        clearing: true
        obstacle_max_range: 2.5
        obstacle_min_range: 0.1
        raytrace_max_range: 3.0
        raytrace_min_range: 0.1

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.20
      cost_scaling_factor: 2.0

# ----------------- RECOVERIES -----------------
back_up:
  ros__parameters:
    plugin: "nav2_recoveries::BackUp"
    backup_distance: 0.3
    velocity: 0.1

# ----------------- LIFECYCLE MANAGER -----------------
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["slam_toolbox","planner_server","controller_server","recoveries_server","bt_navigator","velocity_smoother"]

