ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    # Phase 5C.2: CHUYỂN BÀN GIAO publish_tf: true ĐỂ EKF PHÁT DYNAMIC TF odom -> base_link
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. Wheel Odometry (/odom)
    # Tích hợp Position X/Y, Yaw Orientation và Linear Velocity X
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # 2. MPU6050 IMU (/imu)
    # CHỈ TÍCH HỢP Gyroscope Z Angular Velocity (vyaw)
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false

    print_diagnostics: true
